<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student Record Management System</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Student Record Management System</h1>

  <!-- FORM SECTION -->
  <div class="form-container">
    <h2 id="form-title">Add Student</h2>

    <form id="student-form">
      <!-- hidden field to store the database row id when editing -->
      <input type="hidden" id="record-id" />

      <label for="student_id">Student ID</label>
      <input type="text" id="student_id" required />

      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" required />

      <label for="program">Program</label>
      <input type="text" id="program" required />

      <label for="year_level">Year Level</label>
      <input type="text" id="year_level" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <button type="submit" id="submit-btn">Save Student</button>
      <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
    </form>
  </div>

  <!-- TABLE SECTION -->
  <h2>Student Records</h2>
  <table id="student-table">
    <thead>
      <tr>
        <th>Student ID</th>
        <th>Full Name</th>
        <th>Program</th>
        <th>Year Level</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="student-table-body">
      <!-- Rows are added here by JavaScript -->
    </tbody>
  </table>

  <!-- Supabase JS library (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
